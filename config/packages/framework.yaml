# config/packages/framework.yaml
framework:
    secret: '%env(APP_SECRET)%'
    
    session:
        handler_id: 'session.handler.native_file'
        save_path: '%kernel.cache_dir%/sessions'
        storage_factory_id: session.storage.factory.native
        
        cookie_secure: auto   
        cookie_samesite: lax  
        
        cookie_lifetime: 0 # Le cookie de session expire uniquement quand on ferme complètement le navigateur
        gc_maxlifetime: 43200 #Le serveur garde les données 12 heures (idéal pour tenir toute une journée de travail avec les mises en veille)
    
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file